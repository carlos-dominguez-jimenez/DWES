{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo%}Gestión de Tareas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/estilos.css' %}">
    <script src="{% static 'blog/js/script.js' %}"></script>
</head>
<body>
    {% include 'estructura/menu.html' %}

    <header class="cabecera">
        <img src="{% static 'blog/img/logo.png' %}" alt="Logo">
        {% block cabecera %}
            <h1>Gestión de Tareas</h1>
        {% endblock %}
    </header>

    <main>
        {% block contenido %}{% endblock %}
    </main>

    {% include 'estructura/pie.html' %}
    <button id="btn-subir">Subir</button>
</body>
</html>
