services:

 web:
  build: .
  container_name: php_web
  ports:
   - "8080:80"
  volumes:
   - ./src:/var/www/html
  depends_on:
   - db

 db:
  image: mysql:8.4
  container_name: mysql_db
  restart: always
  environment:
   MYSQL_ROOT_PASSWORD: root
   MYSQL_DATABASE: gestisimal
   MYSQL_USER: usuario
   MYSQL_PASSWORD: clave
  ports:
   - "3306:3306"
  volumes:
   - mysql_data:/var/lib/mysql

 phpmyadmin:
  image: phpmyadmin:latest
  container_name: phpmyadmin
  ports:
   - "8081:80"
  environment:
   PMA_HOST: db
  depends_on:
   - db

volumes:
  mysql_data: